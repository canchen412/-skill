<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#F5EFE2}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:radial-gradient(1200px 900px at 50% 38%,#FBF7EE 0%,#F0E7D3 100%)}
.stage{position:relative;width:1920px;height:1080px;display:flex;align-items:center;justify-content:center}
.top{position:absolute;top:180px;left:0;width:100%;text-align:center;color:#B4A788;
  font-size:32px;letter-spacing:.35em;font-weight:600}
.bottom{position:absolute;bottom:150px;left:0;width:100%;text-align:center;color:#B4A788;
  font-size:28px;letter-spacing:.15em}
.core{display:flex;flex-direction:column;align-items:center;gap:90px}

/* 逐字卡拉OK行：外层 mask，grid 叠层同位切换 */
.clip{overflow:hidden;display:grid;padding:.3em .1em;margin:-.3em -.1em}
.kline{grid-area:1/1;justify-self:center;position:relative;
  display:inline-block;font-size:74px;font-weight:800;color:#1A1A1A;letter-spacing:.04em;
  white-space:nowrap;
  animation:rise .45s cubic-bezier(.16,1,.3,1) both, lineExit .25s ease-in forwards}
.kl1{animation-delay:.1s,2.9s}
.kl2{animation-delay:3.1s,5.75s}

/* 普通字：灰米色 → 墨黑，逐字跳变（卡拉OK填充） */
.ch{display:inline-block;color:#CFC4AC;animation:fillInk .18s steps(1,end) both}

/* 重点字：填充为红 + 到达时弹跳 */
.chk{display:inline-block;color:#CFC4AC;
  animation:fillRed .18s steps(1,end) both, chkPop .45s cubic-bezier(.34,1.56,.64,1) both}
.kl1 .c0{animation-delay:.40s,.40s}
.kl1 .c1{animation-delay:.52s,.52s}
.kl2 .c2{animation-delay:3.34s,3.34s}
.kl2 .c3{animation-delay:3.46s,3.46s}
.kl2 .c4{animation-delay:3.58s,3.58s}
.kl2 .c5{animation-delay:3.70s,3.70s}
.kl1 .c0{animation-name:fillRed,chkPop}
/* 逐字填充时刻表 */
.kl1 .c2{animation-delay:.64s}
.kl1 .c3{animation-delay:.76s}
.kl1 .c4{animation-delay:.88s}
.kl1 .c5{animation-delay:1.00s}
.kl1 .c6{animation-delay:1.12s}
.kl1 .c7{animation-delay:1.24s}
.kl1 .c8{animation-delay:1.36s}
.kl1 .c9{animation-delay:1.48s}
.kl1 .c10{animation-delay:1.60s}
.kl1 .c11{animation-delay:1.72s}
.kl1 .c12{animation-delay:1.84s}
.kl2 .c0{animation-delay:3.10s}
.kl2 .c1{animation-delay:3.22s}
.kl2 .c6{animation-delay:3.82s}
.kl2 .c7{animation-delay:3.94s}
.kl2 .c8{animation-delay:4.06s}
.kl2 .c9{animation-delay:4.18s}
.kl2 .c10{animation-delay:4.30s}
.kl2 .c11{animation-delay:4.42s}

/* 结尾重点章 */
.stamp{font-size:118px;font-weight:800;color:#D8331F;letter-spacing:.06em;
  border:10px solid #D8331F;border-radius:26px;padding:34px 64px;
  animation:stampIn .5s cubic-bezier(.34,1.56,.64,1) both;
  animation-delay:6s;position:relative}
.stamp .sub{position:absolute;top:-.62em;right:-.3em;background:#D8331F;color:#FBF7EE;
  font-size:26px;font-weight:700;letter-spacing:.2em;padding:6px 14px;border-radius:8px;
  transform:rotate(6deg)}
@keyframes rise{from{transform:translateY(185%)}to{transform:translateY(0)}}
@keyframes lineExit{to{transform:translateY(-150%);opacity:0}}
@keyframes fillInk{from{color:#CFC4AC}to{color:#1A1A1A}}
@keyframes fillRed{from{color:#CFC4AC}to{color:#D8331F}}
@keyframes chkPop{0%{transform:scale(1)}45%{transform:scale(1.45)}75%{transform:scale(.92)}100%{transform:scale(1)}}
@keyframes stampIn{0%{transform:scale(2.4) rotate(-5deg);opacity:0}
  60%{transform:scale(.94) rotate(-5deg);opacity:1}
  100%{transform:scale(1) rotate(-5deg)}}
</style>
</head>
<body>
<div class="stage">
  <div class="top">AI CAPTION VIDEO 风格</div>
  <div class="core">
    <div class="clip">
      <div class="kline kl1 animated"><span class="chk c0 animated">纯</span><span class="chk c1 animated">度</span><span class="ch c2 animated">不</span><span class="ch c3 animated">够</span><span class="ch c4 animated">的</span><span class="ch c5 animated">肌</span><span class="ch c6 animated">酸</span><span class="ch c7 animated">，</span><span class="ch c8 animated">喝</span><span class="ch c9 animated">了</span><span class="ch c10 animated">也</span><span class="ch c11 animated">白</span><span class="ch c12 animated">喝</span></div>
      <div class="kline kl2 animated"><span class="ch c0 animated">认</span><span class="ch c1 animated">准</span><span class="chk c2 animated">检</span><span class="chk c3 animated">测</span><span class="chk c4 animated">报</span><span class="chk c5 animated">告</span><span class="ch c6 animated">，</span><span class="ch c7 animated">随</span><span class="ch c8 animated">你</span><span class="ch c9 animated">拿</span><span class="ch c10 animated">去</span><span class="ch c11 animated">比</span></div>
    </div>
    <div class="stamp animated">重点是：<span style="color:#1A1A1A">纯度</span><i class="sub">划重点</i></div>
  </div>
  <div class="bottom">DEMO B · 逐字卡拉OK填充 + 重点章</div>
</div>
<script>
function setTime(t){
  const ms = t * 1000;
  document.getAnimations().forEach(a => { a.pause(); a.currentTime = ms; });
}
window.setTime = setTime;
document.fonts.ready.then(() => { window.__ready = true; });
window.__ready = true;
</script>
</body>
</html>
